    estado: vigente
    tipo: ley
    resumen: "Infracción por incumplir los acuerdos generales de implementación de la responsabilidad extendida del productor."
    cubre_litio_ve: indirecto
    archivo_local: docs/fuentes_primarias/LGPGIR_texto_vigente_ultima_reforma_DOF_2026-01-19.pdf
    verificacion: "fuente primaria"
